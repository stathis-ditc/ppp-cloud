apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  destination:
    namespace: 'kube-system'
    server: 'https://kubernetes.default.svc'
  source:
    path: argocd/bootstrap
    repoURL: 'https://github.com/stathis-ditc/ppp-cloud.git'
    targetRevision: main
  project: local-k8s
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
